name: APK

# a cada mudança no app: gera o APK assinado e publica como "release" (dá pra baixar direto no tablet)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: chave de assinatura
        run: echo "${{ secrets.CHAVE_P12 }}" | base64 -d > $RUNNER_TEMP/chave.p12
      - name: build
        env:
          CHAVE_ARQUIVO: ${{ runner.temp }}/chave.p12
          CHAVE_SENHA: ${{ secrets.CHAVE_SENHA }}
        run: gradle :app:assembleRelease --no-daemon
      - name: renomeia
        run: cp app/build/outputs/apk/release/app-release.apk bit-hub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BIT hub v${{ github.run_number }}
          files: bit-hub.apk
          make_latest: true
